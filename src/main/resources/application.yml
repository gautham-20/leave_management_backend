server:
  port: ${PORT:8080}
  error:
    # Let the GlobalExceptionHandler produce JSON instead of the default error page.
    include-message: always

spring:
  application:
    name: leave-management-api

  config:
    import: "optional:file:.env[.properties]"

  # The default datasource is MySQL, which is what local development uses.
  # Railway deployment overrides this with SPRING_DATASOURCE_URL — see the
  # application-railway.yml profile. Leaving the URL fully overridable means a
  # single deployment works against either database.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:leave_management}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:leaveuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:leavepass}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    # Flyway owns the schema; Hibernate must never alter it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # No explicit dialect: Hibernate resolves it from the JDBC connection,
        # so the same build works against MySQL and PostgreSQL. Setting
        # `dialect` here triggers HHH90000025 and would also pin one database.
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    # {vendor} resolves to "mysql" or "postgresql" at runtime, so each database
    # runs its own dialect-specific migrations from db/migration/<vendor>/.
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Must be supplied via JWT_SECRET (32+ chars). The placeholder only exists
    # so a local run without any setup produces one clear error message.
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    org.springframework.security: INFO